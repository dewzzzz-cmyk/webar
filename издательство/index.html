<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ИИ-Издательство · Студия</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="layout">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-dot"></span>
      <div>
        <div class="brand-name" id="studio-name">ИИ-Издательство</div>
        <div class="brand-sub">студия</div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <button class="nav-item active" data-view="projects"><span>📚</span> Проекты <i class="nav-badge" id="nav-review">0</i></button>
      <button class="nav-item" data-view="staff"><span>👥</span> Штат</button>
      <button class="nav-item" data-view="policy"><span>🎯</span> Редполитика</button>
    </nav>
    <div class="sidebar-foot">
      <div class="kpi"><div class="kpi-v" id="kpi-books">0</div><div class="kpi-k">книг в работе</div></div>
      <div class="kpi"><div class="kpi-v" id="kpi-done">0</div><div class="kpi-k">выпущено</div></div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main" id="main"><!-- views injected here --></main>
</div>

<!-- DRAWER (review / forms) -->
<div class="drawer-scrim" id="scrim"></div>
<section class="drawer" id="drawer" aria-hidden="true">
  <header class="drawer-head">
    <div class="drawer-title" id="drawer-title">—</div>
    <button class="icon-btn" id="drawer-close">✕</button>
  </header>
  <div class="drawer-body" id="drawer-body"></div>
</section>

<script src="app.js"></script>
</body>
</html>
