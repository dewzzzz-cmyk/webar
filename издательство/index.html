<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ИИ-Издательство · Конвейер</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-dot"></span> ИИ-Издательство</div>
  <input id="proj-title" class="title-input" placeholder="Название книги…">
  <div class="spacer"></div>
  <span class="hint-pill" id="api-state">● ключ не задан</span>
  <button class="btn ghost" data-action="add-node">＋ Агент</button>
  <button class="btn ghost" data-action="auto-layout">⤢ Авто-схема</button>
  <button class="btn ghost" data-action="settings">⚙ Настройки</button>
  <button class="btn primary" data-action="run" id="run-btn">▶ Запустить конвейер</button>
</header>

<div class="projbar">
  <input id="proj-genre" placeholder="Жанр">
  <input id="proj-aud" placeholder="Аудитория">
  <input id="proj-brief" class="grow" placeholder="Бриф / задача для команды">
  <select id="proj-mode">
    <option value="write">✒️ писать с нуля</option>
    <option value="edit">📖 редактировать исходник</option>
  </select>
  <button class="btn ghost sm" data-action="edit-input" id="input-btn">📄 Исходник</button>
</div>

<div class="canvas" id="canvas">
  <svg class="edges" id="edges"></svg>
  <div class="nodes" id="nodes"></div>
  <div class="canvas-hint" id="canvas-hint"></div>
</div>

<div class="drawer-scrim" id="scrim"></div>
<section class="drawer" id="drawer" aria-hidden="true">
  <header class="drawer-head"><div class="drawer-title" id="drawer-title">—</div>
    <button class="icon-btn" id="drawer-close">✕</button></header>
  <div class="drawer-body" id="drawer-body"></div>
</section>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
