# Kustomization Base
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ppe-detection

resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - redis.yaml
  - api.yaml
  - detector.yaml
  - capture.yaml
  - dashboard.yaml
  - ingress.yaml
  - network-policies.yaml
  - security-policies.yaml

commonLabels:
  app.kubernetes.io/name: ppe-detection
  app.kubernetes.io/part-of: ppe-system
  app.kubernetes.io/managed-by: kustomize
