# Kustomization Production Overlay
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ppe-detection

resources:
  - ../../base

namePrefix: prod-

commonLabels:
  environment: production

# Production-specific patches
patches:
  # Increase API replicas
  - patch: |
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: api

  # Increase Dashboard replicas
  - patch: |
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: dashboard

  # Increase resource limits
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1000m"
    target:
      kind: Deployment
      name: api

# Production images (from container registry)
images:
  - name: ppe-api
    newName: your-registry.com/ppe/api
    newTag: v2.2.0
  - name: ppe-detector
    newName: your-registry.com/ppe/detector
    newTag: v2.2.0
  - name: ppe-capture
    newName: your-registry.com/ppe/capture
    newTag: v2.2.0
  - name: ppe-dashboard
    newName: your-registry.com/ppe/dashboard
    newTag: v2.2.0

# Production ConfigMap patches
configMapGenerator:
  - name: ppe-config
    behavior: merge
    literals:
      - LOG_LEVEL=WARNING
      - CONFIDENCE_THRESHOLD=0.6

# Secret generator (use external-secrets in real production!)
secretGenerator:
  - name: ppe-secrets
    behavior: merge
    literals:
      - POSTGRES_PASSWORD=CHANGE_THIS_PRODUCTION_PASSWORD
