[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
asyncio_mode = auto
timeout = 60

# Markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may require mocked services)
    slow: Slow tests (skip with -m "not slow")
    security: Security-related tests

# Coverage settings (use with pytest-cov)
# Run: pytest --cov=services --cov-report=html --cov-report=term-missing
