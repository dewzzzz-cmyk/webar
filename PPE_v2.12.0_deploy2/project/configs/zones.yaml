# Конфигурация зон контроля для PPE Detection System
#
# Каждая зона определяет:
# - Какие СИЗ обязательны
# - Какие каналы уведомлений использовать
# - Cooldown между алертами

zones:
  # Зона по умолчанию (для всей территории)
  - id: zone_default
    name: "Вся территория"
    required_ppe:
      - hardhat    # Каска
      - vest       # Жилет
    alert_channels:
      - telegram
    cooldown_seconds: 30

  # Входная группа - базовые требования
  - id: zone_entrance
    name: "Входная группа"
    required_ppe:
      - hardhat
      - vest
    alert_channels:
      - telegram
    cooldown_seconds: 60    # Реже алерты, т.к. люди входят/выходят

  # Сварочный участок - повышенные требования
  - id: zone_welding
    name: "Сварочный участок"
    required_ppe:
      - hardhat
      - vest
      - glasses    # Защитные очки/маска
      - gloves     # Перчатки
    alert_channels:
      - telegram
      - email      # Дублируем на почту (критичная зона)
    cooldown_seconds: 15    # Чаще алерты, опасная зона

  # Складская зона - средние требования
  - id: zone_warehouse
    name: "Склад"
    required_ppe:
      - hardhat
      - vest
    alert_channels:
      - telegram
    cooldown_seconds: 30

  # Офисная зона - минимальные требования
  - id: zone_office
    name: "Офисная зона"
    required_ppe: []        # СИЗ не требуются
    alert_channels: []      # Без алертов
    cooldown_seconds: 0


# ============================================================================
# Доступные типы СИЗ:
# ============================================================================
#
# hardhat  - Каска / Шлем
# vest     - Жилет сигнальный
# glasses  - Защитные очки
# gloves   - Перчатки
# mask     - Маска / Респиратор
# boots    - Защитная обувь
#
# ============================================================================
# Доступные каналы уведомлений:
# ============================================================================
#
# telegram - Telegram бот
# email    - Email (требует настройки SMTP)
# sms      - SMS (требует интеграции с провайдером)
# webhook  - HTTP webhook
# siren    - Сирена/реле (требует интеграции с оборудованием)
#
# ============================================================================
