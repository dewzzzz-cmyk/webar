# Grafana Dashboard Provisioning

apiVersion: 1

providers:
  - name: 'PPE Detection Dashboards'
    orgId: 1
    folder: 'PPE Detection'
    folderUid: 'ppe'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
